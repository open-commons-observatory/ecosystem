# This repository's mark: how it fits the Open Commons Observatory's picture.
schema = 1

[project]
id = "open-commons-observatory/ecosystem"
name = "OCO: the open commons' ecosystem - what holds between its stars"
title = "OCO"
kind = "constellation"
parent = "open-commons-observatory"

[exports]
backlog = "oco/backlog.json"
milestones = "oco/milestones.json"
session_log = "oco/session_log.json"
problems = "oco/problems.json"
decisions = "oco/decisions.json"
connections = "oco/connections.json"
people = "oco/people.json"
lens_parts = "oco/lens_parts.json"
lens_entries = "oco/lens_entries.json"
lens_fields = "oco/lens_fields.json"
lens_tables = "oco/lens_tables.json"
lenses = "oco/lenses.json"
reflections = "oco/reflections.json"
glimpses = "oco/glimpses.json"
activity = "oco/gathered/activity.json@oco-data"
releases = "oco/gathered/releases.json@oco-data"
ci = "oco/gathered/ci.json@oco-data"

# What place this is, and what it gathers: a star by name, or every star of an owner (owner/*).
[place]
is = "constellation"
gathers = ["open-commons-observatory/ocoeco", "open-commons-observatory/ocoeco-engine", "creation-guidelines/tad-engine", "creation-guidelines/lab-agent", "argenv-opencommons/argenv"]
